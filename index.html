    <script>
      // Apply the saved theme (footer picker) before the first paint so a forced

          --bg: #14181a;
          --surface: #1c2224;
          --surface-2: #20272a;
          --border: #323b3e;
          --text: #e9ecec;
          --text-muted: #a4aeb0;
          --text-faint: #707b7d;
          --accent: #dd7c67;
          --accent-strong: #e89686;
          --accent-soft: #3a2521;
          --gold: #d9ae5a;
          --gold-soft: #392e19;
          --teal: #63b3ac;
          --teal-soft: #173330;
          --plum: #b896d6;
          --success: #69b583;
          --success-soft: #1b3324;
          --warning: #dda25b;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px -12px rgba(0, 0, 0, 0.5);
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #14181a;
        --surface: #1c2224;
        --surface-2: #20272a;
        --border: #323b3e;
        --text: #e9ecec;
        --text-muted: #a4aeb0;
        --text-faint: #707b7d;
        --accent: #dd7c67;
        --accent-strong: #e89686;
        --accent-soft: #3a2521;
        --gold: #d9ae5a;
        --gold-soft: #392e19;
        --teal: #63b3ac;
        --teal-soft: #173330;
        --plum: #b896d6;
        --success: #69b583;
        --success-soft: #1b3324;
        --warning: #dda25b;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px -12px rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.55;
      }
      h1,
      h2,
      h3 {
        font-family: var(--font-display);
        margin: 0;
        text-wrap: balance;
      }
      p {
        margin: 0;
      }
      ul,
      ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      button,
      input {
        font-family: inherit;
        color: inherit;
      }
      a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      a:hover {
        color: var(--accent-strong);
      }
      em {
        font-style: italic;
        color: var(--warning);
      }
      strong {
        font-weight: 700;
      }
      button:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .page {
        max-width: 860px;
        margin: 0 auto;
        padding-inline: 10px;
        padding-block: 28px 64px;
      }

      /* ---------- Header ---------- */
      .hero {
        display: flex;
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
      .hero h1 {
        font-size: clamp(1.9rem, 1.5rem + 1.6vw, 2.5rem);
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .clocks {
        color: var(--text-muted);
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
        margin-top: 4px;
      }
      .clocks strong {
        color: var(--text);
        font-weight: 600;
      }

      /* ---------- Sticky tabs ---------- */
      :root {
        --tabs-h: 58px;
        --fade-h: 32px;
      }
      .sticky-bar {
        position: sticky;
        background: var(--bg);
      }
      /* Once pinned (data-stuck, set from App), the bar fades into the page below */
      .sticky-bar::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        height: var(--fade-h);
        background: linear-gradient(to bottom, var(--bg), transparent);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .sticky-bar[data-stuck]::after {
        opacity: 1;
      }

      /* ---------- Tabs (segmented control) ---------- */
      .tabs {
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        height: calc(var(--tabs-h) + 40px);
        display: flex;
        align-items: center;
        margin-top: 18px;
      }
      .segment {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: max-content;
        max-width: 100%;
        min-width: 0;
        margin-inline: auto;
        padding: 3px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 21px;
        box-shadow: var(--shadow);
      }
      .segment-tabs {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }
      .segment-tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 34px;
        padding: 0 14px;
        font-weight: 600;
        font-size: 0.88rem;
        color: var(--text-muted);
        background: none;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background-color 0.15s,
          color 0.15s;
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.active {
        background: var(--accent-soft);
        color: var(--accent-strong);
      }
      .tab svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      /* ---------- Search (Recetas) ---------- */
      .search-wrap {
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 10px 15px;
        box-shadow: var(--shadow);
      }
      .search-wrap svg {
        flex-shrink: 0;
        stroke: var(--text-faint);
      }
      .search-wrap input {
        border: none;
        outline: none;
        background: none;
        flex: 1;
        font-size: 0.92rem;
        min-width: 0;
      }
      .search-wrap input::placeholder {
        color: var(--text-faint);
      }
      .search-wrap input::-webkit-search-cancel-button {
        -webkit-appearance: none;
        appearance: none;
      }
      .search-clear {
        border: none;
        background: var(--surface-2);
        color: var(--text-muted);
        border-radius: 999px;
        width: 20px;
        height: 20px;
        font-size: 0.7rem;
        cursor: pointer;
        flex-shrink: 0;
      }
      .empty {
        color: var(--text-muted);
        font-style: italic;
        padding: 24px 4px;
        text-align: center;
      }
      .search-count {
        color: var(--text-muted);
        font-size: 0.85rem;
        padding-inline: 4px;
      }

      /* ---------- Day panel (Hoy) ---------- */
      .day-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-m);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .day-panel-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px;
      }
      .day-num {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: var(--accent);
        width: 38px;
        line-height: 1;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      .day-num-d {
        font-weight: 600;
        font-size: 1.4rem;
      }
      .day-num-m {
        margin-top: 3px;
        font-size: 0.62rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }
      .day-main {
        flex: 1;
        min-width: 0;
      }
      .day-route {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.03rem;
        color: var(--text);
      }
      .day-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        font-size: 0.79rem;
        color: var(--text-muted);
        margin-top: 3px;
        font-variant-numeric: tabular-nums;
      }
      .dot {
        color: var(--text-faint);
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .day-body {
        padding: 16px 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        border-top: 1px solid var(--border);
      }
      .today-note {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-m);
        box-shadow: var(--shadow);
        padding: 28px 20px;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.9rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .today-note-title {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.1rem;
        color: var(--text);
      }
      @media (max-width: 480px) {
        .day-panel-head {
          gap: 10px;
          padding: 12px;
        }
        .tab {
          padding: 0 11px;
          font-size: 0.84rem;
        }
      }
      /* Four tabs with names do not fit a phone: only the active one keeps its name */
      @media (max-width: 440px) {
        .tab:not(.active) .tab-label {
          display: none;
        }
      }

      /* ---------- Sections ---------- */
      .section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .day-body > .section + .section {
        border-top: 1px dashed var(--border);
        padding-top: 16px;
      }
      .section-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
        color: var(--gold);
      }
      .block-notes {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 0.85rem;
        color: var(--text-muted);
      }
      .badge {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .badge-success {
        background: var(--success-soft);
        color: var(--success);
      }
      .badge-warning {
        background: var(--gold-soft);
        color: var(--warning);
      }
      .badge-muted {
        background: var(--surface-2);
        color: var(--text-muted);
        font-weight: 600;
      }

      /* ---------- Timeline: one dot per meal, joined by a vertical line ---------- */
      .timeline {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      .tl-item {
        position: relative;
        padding: 0 0 20px 30px;
        --dot: var(--text-faint);
      }
      .tl-item:last-child {
        padding-bottom: 0;
      }
      .tl-item::before {
        content: '';
        position: absolute;
        left: 6px;
        top: 10px;
        bottom: -10px;
        width: 2px;
        background: var(--border);
      }
      .tl-item:last-child::before {
        display: none;
      }
      .tl-dot {
        position: absolute;
        left: 0;
        top: 3px;
        z-index: 1;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--dot);
        background: var(--surface);
      }
      .tl-dot.done {
        background: var(--dot);
      }
      /* Dot colour per meal slot (ids of "comidas" in recetas.json) */
      .tl-desayuno {
        --dot: var(--gold);
      }
      .tl-media-manana,
      .tl-merienda {
        --dot: var(--teal);
      }
      .tl-comida {
        --dot: var(--accent);
      }
      .tl-cena {
        --dot: var(--plum);
      }
      .tl-when {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0 6px;
        font-size: 0.72rem;
        line-height: 20px;
        color: var(--text-muted);
      }
      .tl-time {
        font-weight: 700;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        font-size: 0.8rem;
      }
      .tl-kind {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
        color: var(--dot);
      }
      .tl-title {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px 8px;
        font-weight: 600;
        margin-top: 1px;
      }
      .tl-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 4px;
        font-size: 0.87rem;
        color: var(--text-muted);
      }
      .tl-booking {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 8px;
        padding: 8px 12px;
        background: var(--surface-2);
        border-radius: var(--radius-s);
        font-size: 0.84rem;
        color: var(--text-muted);
      }
      .tl-booking-label {
        font-size: 0.66rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
        color: var(--text-faint);
        margin-top: 4px;
      }
      .tl-booking-label:first-child {
        margin-top: 0;
      }
      .tl-steps {
        list-style: decimal;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      /* Recipe name as a link to its card in Recetas */
      .recipe-link {
        padding: 0;
        border: none;
        background: none;
        font: inherit;
        font-weight: 600;
        color: var(--text);
        text-align: left;
        cursor: pointer;
        text-decoration: underline;
        text-decoration-color: var(--border);
        text-underline-offset: 3px;
      }
      .recipe-link:hover {
        color: var(--accent);
        text-decoration-color: currentColor;
      }
      .missing {
        color: var(--warning);
        font-style: italic;
        font-weight: 500;
      }
      .recipe-details {
        margin-top: 6px;
      }
      .recipe-details summary {
        cursor: pointer;
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 600;
        width: max-content;
      }
      /* Opened from a meal in Hoy or Semana: flash the card it lands on */
      .tl-item.target {
        animation: target 1.6s ease-out;
        border-radius: var(--radius-s);
      }
      @keyframes target {
        from {
          background: var(--accent-soft);
        }
        to {
          background: transparent;
        }
      }
      .tl-item {
        scroll-margin-top: calc(var(--tabs-h) + var(--fade-h) + 24px);
      }

      /* ---------- Grouped views (Semana / Recetas) ---------- */
      .grouped-view {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .group-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-m);
        box-shadow: var(--shadow);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .group-card.is-today {
        border-color: var(--accent);
      }
      .group-heading {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
      }
      .group-day {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        color: var(--accent);
        font-size: 0.82rem;
      }
      .group-route {
        font-family: var(--font-display);
        font-weight: 600;
        color: var(--text);
      }
      .group-meta {
        color: var(--text-muted);
        font-size: 0.82rem;
        font-variant-numeric: tabular-nums;
      }

      /* ---------- Productos ---------- */
      .product-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .product-filters .select-shell {
        flex: 1 1 160px;
        min-width: 0;
      }
      .select-shell {
        position: relative;
      }
      .select-shell::after {
        content: '';
        position: absolute;
        right: 15px;
        top: 50%;
        width: 7px;
        height: 7px;
        border-right: 2px solid var(--text-faint);
        border-bottom: 2px solid var(--text-faint);
        transform: translateY(-65%) rotate(45deg);
        pointer-events: none;
      }
      .pill-select {
        appearance: none;
        -webkit-appearance: none;
        display: block;
        width: 100%;
        height: 36px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0 34px 0 14px;
        font-family: var(--font-body);
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text);
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .pill-select option {
        background: var(--surface);
        color: var(--text);
      }
      .pill-select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .product-card {
        gap: 8px;
      }
      .product-name {
        font-weight: 600;
        flex: 1 1 auto;
        min-width: 0;
      }
      .product-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0 6px;
        font-size: 0.82rem;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      .product-price {
        color: var(--text);
        font-weight: 600;
      }
      /* Nutrition per 100 g/ml: six cells, three per row on a phone */
      .nutri {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 6px;
      }
      .nutri-cell {
        background: var(--surface-2);
        border-radius: var(--radius-s);
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .nutri-label {
        font-size: 0.62rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 700;
        color: var(--text-faint);
      }
      .nutri-value {
        font-weight: 700;
        font-size: 0.92rem;
        font-variant-numeric: tabular-nums;
      }
      .nutri-sub {
        font-size: 0.7rem;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      .nutri-cell.missing .nutri-value {
        color: var(--text-faint);
      }
      .product-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
        font-size: 0.74rem;
        color: var(--text-faint);
      }
      /* Source on its own line, then category and the shop link */
      .product-foot span:first-child {
        flex-basis: 100%;
      }
      .product-foot a {
        margin-left: auto;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .more-button {
        align-self: center;
      }
      @media (max-width: 560px) {
        .nutri {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      /* ---------- Footer: data source + theme picker ---------- */
      .page-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-top: 10px;
        padding-top: 20px;
      }
      .data-note {
        font-size: 0.76rem;
        color: var(--text-faint);
        text-align: center;
      }
      .data-note.error {
        color: var(--accent);
      }
      .file-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
      }
      .file-button:hover,
      .file-button:focus-within {
        border-color: var(--accent);
        color: var(--accent);
      }
      .file-button input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      .theme-picker {
        display: flex;
        gap: 2px;
        padding: 3px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 19px;
      }
      .theme-picker .tab {
        height: 30px;
        padding: 0 12px;
        font-size: 0.82rem;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          animation: none !important;
        }
      }
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>

    <script>
      const h = React.createElement;

      /* ============================================================
   DATA — recetas.json, next to this file
   {
     comidas: [{id, label, hora}]          meal slots of the day, in order
     recetas: [{id, nombre, tipos, descripcion, minutos, raciones, kcal,
                macros: {proteinas, carbohidratos, grasas}, ingredientes,
                pasos, notas}]
     semana:  {lunes: {<comida id>: <receta id>}, martes: {...}, ...}
   }
   A day may leave a slot out (no merienda on Saturday, say). The last copy
   that loaded is kept in localStorage, so the page still works when the JSON
   cannot be fetched (opened as file://, offline)
   ============================================================ */
      const DATA_FILE = 'recetas.json';
      const DATA_CACHE = 'dieta-recetas';

      // Plan days in order, keyed like "semana" (no accents in the keys)
      const DIAS = [
        { id: 'lunes', label: 'Lunes' },
        { id: 'martes', label: 'Martes' },
        { id: 'miercoles', label: 'Miércoles' },
        { id: 'jueves', label: 'Jueves' },
        { id: 'viernes', label: 'Viernes' },
        { id: 'sabado', label: 'Sábado' },
        { id: 'domingo', label: 'Domingo' },
      ];
      const MONTHS_SHORT = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

      // Checks the shape the views rely on and indexes recipes by id. Throws a
      // message in Spanish, shown as is, when something required is missing
      function parseData(raw) {
        const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (!d || !Array.isArray(d.comidas) || !Array.isArray(d.recetas) || typeof d.semana !== 'object' || !d.semana) {
          throw new Error('El JSON necesita "comidas", "recetas" y "semana".');
        }
        const byId = {};
        d.recetas.forEach((r) => {
          if (!r.id || !r.nombre) throw new Error('Cada receta necesita "id" y "nombre".');
          byId[r.id] = Object.assign({ tipos: [], ingredientes: [], pasos: [] }, r);
        });
        return { comidas: d.comidas, recetas: d.recetas.map((r) => byId[r.id]), byId, semana: d.semana };
      }

      function loadCached() {
        try {
          const saved = JSON.parse(localStorage.getItem(DATA_CACHE) || 'null');
          return saved ? { data: parseData(saved.json), loadedAt: saved.loadedAt } : null;
        } catch (e) {
          return null;
        }
      }
      function saveCached(json) {
        try {
          localStorage.setItem(DATA_CACHE, JSON.stringify({ json, loadedAt: new Date().toISOString() }));
        } catch (e) {}
      }

      /* ============================================================
   Small shared pieces (same as the Perú itinerary)
   ============================================================ */
      function Badge(props) {
        return h('span', { className: 'badge badge-' + props.tone }, props.children);
      }
      function Section(props) {
        return h('div', { className: 'section' }, h('div', { className: 'section-label' }, props.label), props.children);
      }
      function fmtNum(n) {
        return Math.round(n).toLocaleString('es-ES');
      }
      function normalize(s) {
        return String(s || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[̀-ͯ]/g, '');
      }

      // Icons from Lucide (lucide.dev, ISC license), inlined so they render
      // offline: calendar-1, calendar-days, utensils, shopping-basket, search, upload
      const ICONS = {
        hoy: '<path d="M11 13h1v4"/><path d="M16 2v3"/><path d="M3 9h18"/><path d="M8 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/>',
        semana:
          '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>',
        recetas:
          '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
        productos:
          '<path d="m15 11-1 9"/><path d="m19 11-4-7"/><path d="M2 11h20"/><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4"/><path d="M4.5 15.5h15"/><path d="m5 11 4-7"/><path d="m9 11 1 9"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
        upload: '<path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>',
      };
      function Icon(props) {
        const size = props.size || 18;
        return h('svg', {
          width: size,
          height: size,
          viewBox: '0 0 24 24',
          fill: 'none',
          stroke: 'currentColor',
          strokeWidth: 2,
          strokeLinecap: 'round',
          strokeLinejoin: 'round',
          'aria-hidden': 'true',
          dangerouslySetInnerHTML: { __html: ICONS[props.name] },
        });
      }

      /* ============================================================
   Day plan: the meals of one day of "semana", as a timeline
   ============================================================ */
      // Slots that day fills, in the order of "comidas", with their recipe
      // (null when the id does not match any recipe)
      function dayMeals(data, diaId) {
        const plan = data.semana[diaId] || {};
        return data.comidas
          .filter((c) => plan[c.id])
          .map((c) => ({ comida: c, recetaId: plan[c.id], receta: data.byId[plan[c.id]] || null }));
      }

      function dayTotals(meals) {
        const t = { kcal: 0, proteinas: 0, carbohidratos: 0, grasas: 0 };
        meals.forEach((m) => {
          const r = m.receta;
          if (!r) return;
          t.kcal += r.kcal || 0;
          const mac = r.macros || {};
          t.proteinas += mac.proteinas || 0;
          t.carbohidratos += mac.carbohidratos || 0;
          t.grasas += mac.grasas || 0;
        });
        return t;
      }

      function recipeFacts(r) {
        const out = [];
        if (r.kcal != null) out.push(fmtNum(r.kcal) + ' kcal');
        if (r.minutos != null) out.push(r.minutos + ' min');
        if (r.raciones != null) out.push(r.raciones + (r.raciones === 1 ? ' ración' : ' raciones'));
        return out.join(' · ');
      }
      function macrosText(m) {
        if (!m) return null;
        const parts = [];
        if (m.proteinas != null) parts.push('Proteínas ' + fmtNum(m.proteinas) + ' g');
        if (m.carbohidratos != null) parts.push('Hidratos ' + fmtNum(m.carbohidratos) + ' g');
        if (m.grasas != null) parts.push('Grasas ' + fmtNum(m.grasas) + ' g');
        return parts.length ? parts.join(' · ') : null;
      }

      // Ingredients, steps and notes in the grey box under a recipe
      function RecipeBox(props) {
        const r = props.receta;
        return h(
          'div',
          { className: 'tl-booking' },
          r.ingredientes.length ? h('div', { className: 'tl-booking-label' }, 'Ingredientes') : null,
          r.ingredientes.length ? h('ul', null, r.ingredientes.map((t, i) => h('li', { key: i }, '– ' + t))) : null,
          r.pasos.length ? h('div', { className: 'tl-booking-label' }, 'Preparación') : null,
          r.pasos.length ? h('ol', { className: 'tl-steps' }, r.pasos.map((t, i) => h('li', { key: i }, t))) : null,
          r.notas ? h('div', { className: 'tl-booking-label' }, 'Notas') : null,
          r.notas ? h('p', null, r.notas) : null,
        );
      }

      // One meal of a day. full (Hoy) adds macros, ingredients and steps;
      // the Semana cards keep the name and the facts line
      function MealItem(props) {
        const m = props.meal;
        const r = m.receta;
        return h(
          'li',
          { className: 'tl-item tl-' + m.comida.id },
          h('span', { className: 'tl-dot' + (props.past ? ' done' : ''), 'aria-hidden': 'true' }),
          h(
            'div',
            { className: 'tl-when' },
            m.comida.hora ? h('span', { className: 'tl-time' }, m.comida.hora) : null,
            m.comida.hora ? h('span', { className: 'dot' }, '·') : null,
            h('span', { className: 'tl-kind' }, m.comida.label),
          ),
          h(
            'div',
            { className: 'tl-title' },
            r
              ? h('button', { type: 'button', className: 'recipe-link', onClick: () => props.onOpenRecipe(r.id) }, r.nombre)
              : h('span', { className: 'missing' }, 'Receta no encontrada: ' + m.recetaId),
          ),
          r
            ? h(
                'ul',
                { className: 'tl-info' },
                h('li', null, recipeFacts(r)),
                props.full && macrosText(r.macros) ? h('li', null, macrosText(r.macros)) : null,
              )
            : null,
          r && props.full ? h(RecipeBox, { receta: r }) : null,
        );
      }

      function DayTimeline(props) {
        return h(
          'ol',
          { className: 'timeline' },
          props.meals.map((m, i) =>
            h(MealItem, {
              key: m.comida.id,
              meal: m,
              full: props.full,
              past: props.pastUntil != null && i < props.pastUntil,
              onOpenRecipe: props.onOpenRecipe,
            }),
          ),
        );
      }

      /* ============================================================
   Hoy: today's day of the week, with every recipe in full
   ============================================================ */
      // Monday-first index into DIAS of the device's local date
      function todayDia(now) {
        return DIAS[(now.getDay() + 6) % 7];
      }

      // Meals already past their time (dot filled, like a booked item in the itinerary)
      function pastCount(meals, now) {
        const mins = now.getHours() * 60 + now.getMinutes();
        return meals.filter((m) => {
          const p = /^(\d{1,2}):(\d{2})$/.exec(m.comida.hora || '');
          return p && Number(p[1]) * 60 + Number(p[2]) + 60 <= mins;
        }).length;
      }

      function TodayView(props) {
        const now = new Date();
        const dia = todayDia(now);
        const meals = dayMeals(props.data, dia.id);
        const t = dayTotals(meals);
        if (!meals.length) {
          return h(
            'section',
            { className: 'view' },
            h(
              'div',
              { className: 'today-note' },
              h('p', { className: 'today-note-title' }, 'Hoy no hay comidas en el plan'),
              h('p', null, 'Añade el ' + dia.label.toLowerCase() + ' a "semana" en ' + DATA_FILE + '.'),
            ),
          );
        }
        return h(
          'section',
          { className: 'view' },
          h(
            'article',
            { className: 'day-panel' },
            h(
              'div',
              { className: 'day-panel-head' },
              h(
                'div',
                { className: 'day-num', 'aria-hidden': 'true' },
                h('span', { className: 'day-num-d' }, now.getDate()),
                h('span', { className: 'day-num-m' }, MONTHS_SHORT[now.getMonth()]),
              ),
              h(
                'div',
                { className: 'day-main' },
                h('div', { className: 'day-route' }, dia.label),
                h(
                  'div',
                  { className: 'day-meta' },
                  h('span', { className: 'num' }, fmtNum(t.kcal) + ' kcal'),
                  h('span', { className: 'dot' }, '·'),
                  h('span', null, meals.length + (meals.length === 1 ? ' comida' : ' comidas')),
                  t.proteinas ? h('span', { className: 'dot' }, '·') : null,
                  t.proteinas ? h('span', { className: 'num' }, 'P ' + fmtNum(t.proteinas) + ' g') : null,
                  t.carbohidratos ? h('span', { className: 'dot' }, '·') : null,
                  t.carbohidratos ? h('span', { className: 'num' }, 'HC ' + fmtNum(t.carbohidratos) + ' g') : null,
                  t.grasas ? h('span', { className: 'dot' }, '·') : null,
                  t.grasas ? h('span', { className: 'num' }, 'G ' + fmtNum(t.grasas) + ' g') : null,
                ),
              ),
            ),
            h(
              'div',
              { className: 'day-body' },
              h(
                Section,
                { label: 'Plan del día' },
                h(DayTimeline, { meals, full: true, pastUntil: pastCount(meals, now), onOpenRecipe: props.onOpenRecipe }),
              ),
            ),
          ),
        );
      }

      /* ============================================================
   Semana: every day of the plan, one card each, today marked
   ============================================================ */
      function WeekView(props) {
        const today = todayDia(new Date()).id;
        return h(
          'section',
          { className: 'view grouped-view' },
          DIAS.map((dia) => {
            const meals = dayMeals(props.data, dia.id);
            const t = dayTotals(meals);
            return h(
              'div',
              { key: dia.id, className: 'group-card' + (dia.id === today ? ' is-today' : '') },
              h(
                'div',
                { className: 'group-heading' },
                h('span', { className: 'group-route' }, dia.label),
                dia.id === today ? h(Badge, { tone: 'warning' }, 'Hoy') : null,
                meals.length ? h('span', { className: 'dot' }, '·') : null,
                meals.length ? h('span', { className: 'group-meta' }, fmtNum(t.kcal) + ' kcal') : null,
              ),
              meals.length
                ? h(DayTimeline, { meals, onOpenRecipe: props.onOpenRecipe })
                : h('p', { className: 'empty' }, 'Sin comidas planificadas.'),
            );
          }),
        );
      }

      /* ============================================================
   Recetas: every recipe, grouped by its first meal type, with a filter
   ============================================================ */
      // Where the plan uses a recipe: "Lunes (Comida)", …
      function recipeUses(data, id) {
        const out = [];
        DIAS.forEach((dia) => {
          const plan = data.semana[dia.id] || {};
          data.comidas.forEach((c) => {
            if (plan[c.id] === id) out.push(dia.label + ' (' + c.label.toLowerCase() + ')');
          });
        });
        return out;
      }

      function recipeText(r) {
        return normalize([r.nombre, r.descripcion, r.notas].concat(r.ingredientes, r.tipos).join(' '));
      }

      function RecipeItem(props) {
        const r = props.receta;
        const data = props.data;
        const label = (id) => (data.comidas.find((c) => c.id === id) || { label: id }).label;
        const uses = recipeUses(data, r.id);
        return h(
          'li',
          { className: 'tl-item tl-' + (r.tipos[0] || 'otro') + (props.target ? ' target' : ''), id: 'receta-' + r.id },
          h('span', { className: 'tl-dot', 'aria-hidden': 'true' }),
          h(
            'div',
            { className: 'tl-when' },
            r.tipos.map((t, i) =>
              h(React.Fragment, { key: t }, i ? h('span', { className: 'dot' }, '·') : null, h('span', { className: 'tl-kind' }, label(t))),
            ),
          ),
          h('div', { className: 'tl-title' }, r.nombre),
          h(
            'ul',
            { className: 'tl-info' },
            r.descripcion ? h('li', null, r.descripcion) : null,
            h('li', { className: 'num' }, recipeFacts(r)),
            macrosText(r.macros) ? h('li', { className: 'num' }, macrosText(r.macros)) : null,
            h('li', null, uses.length ? 'En el plan: ' + uses.join(', ') : 'No está en el plan de la semana'),
          ),
          h(
            'details',
            // key: re-mount when it becomes the target so it opens even if it was closed by hand
            { className: 'recipe-details', open: props.target || props.expanded, key: props.target ? 'target' : 'idle' },
            h('summary', null, 'Ingredientes y preparación'),
            h(RecipeBox, { receta: r }),
          ),
        );
      }

      function RecipesView(props) {
        const data = props.data;
        const [query, setQuery] = React.useState('');
        const q = normalize(query.trim());
        const list = data.recetas.filter((r) => !q || recipeText(r).includes(q));

        // Opened from a meal: scroll its card into view once it is rendered
        React.useEffect(() => {
          if (!props.target) return;
          const el = document.getElementById('receta-' + props.target);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, [props.target, props.targetTick]);

        const groups = data.comidas
          .map((c) => ({ comida: c, recetas: list.filter((r) => r.tipos[0] === c.id) }))
          .concat([{ comida: { id: 'otro', label: 'Otras' }, recetas: list.filter((r) => !data.comidas.some((c) => c.id === r.tipos[0])) }])
          .filter((g) => g.recetas.length);

        return h(
          'section',
          { className: 'view grouped-view' },
          h(
            'div',
            { className: 'search-wrap' },
            h(Icon, { name: 'search', size: 16 }),
            h('input', {
              type: 'search',
              value: query,
              placeholder: 'Buscar receta o ingrediente',
              'aria-label': 'Buscar receta o ingrediente',
              onChange: (e) => setQuery(e.target.value),
            }),
            query ? h('button', { type: 'button', className: 'search-clear', 'aria-label': 'Borrar', onClick: () => setQuery('') }, '✕') : null,
          ),
          q ? h('p', { className: 'search-count' }, list.length + (list.length === 1 ? ' receta' : ' recetas')) : null,
          groups.length
            ? groups.map((g) =>
                h(
                  'div',
                  { key: g.comida.id, className: 'group-card' },
                  h(
                    'div',
                    { className: 'group-heading' },
                    h('span', { className: 'group-route' }, g.comida.label),
                    h('span', { className: 'dot' }, '·'),
                    h('span', { className: 'group-meta' }, g.recetas.length + (g.recetas.length === 1 ? ' receta' : ' recetas')),
                  ),
                  h(
                    'ol',
                    { className: 'timeline' },
                    g.recetas.map((r) =>
                      h(RecipeItem, { key: r.id, receta: r, data, target: props.target === r.id, expanded: !!q }),
                    ),
                  ),
                ),
              )
            : h('p', { className: 'empty' }, 'Ninguna receta coincide con la búsqueda.'),
        );
      }

      /* ============================================================
   Productos: food products from the Mercadona catalog (productos.json,
   built by build-productos.py), with search, category filter and sorting.
   Loaded the first time the tab opens, with the same fallbacks as recetas.json
   ============================================================ */
      const PRODUCTS_FILE = 'productos.json';
      const PRODUCTS_CACHE = 'dieta-productos';
      const PRODUCTS_PAGE = 40;

      function parseProducts(raw) {
        const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (!d || !Array.isArray(d.productos)) throw new Error('El JSON necesita "productos".');
        return d.productos.map((p) =>
          Object.assign({}, p, { _text: normalize([p.nombre, p.marca, p.categoria, p.subcategoria, p.seccion].join(' ')) }),
        );
      }

      // Sort orders; products without the value go last
      const PRODUCT_SORTS = {
        nombre: { label: 'Nombre', key: (p) => p.nombre.toLowerCase(), dir: 1 },
        proteinas: { label: 'Más proteína', key: (p) => p.proteinas_100, dir: -1 },
        kcal: { label: 'Menos calorías', key: (p) => p.kcal_100, dir: 1 },
        precio: { label: 'Más barato (€/kg o €/l)', key: (p) => p.precio_referencia_eur, dir: 1 },
      };

      function fmtDec(n, digits) {
        return n.toLocaleString('es-ES', { maximumFractionDigits: digits == null ? 1 : digits });
      }
      function fmtEur(n) {
        return n.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
      }
      // 1000 g -> 1 kg, 330 ml -> 330 ml
      function fmtQty(p) {
        if (p.cantidad_neta == null) return null;
        let n = p.cantidad_neta,
          u = p.unidad;
        if ((u === 'g' || u === 'ml') && n >= 1000) {
          n = n / 1000;
          u = u === 'g' ? 'kg' : 'l';
        }
        return (p.peso_aproximado ? '~' : '') + fmtDec(n, 2) + ' ' + u;
      }

      function NutriCell(props) {
        const v = props.value;
        return h(
          'div',
          { className: 'nutri-cell' + (v == null ? ' missing' : '') },
          h('span', { className: 'nutri-label' }, props.label),
          h('span', { className: 'nutri-value' }, v == null ? '—' : fmtDec(v, props.digits) + (props.unit || '')),
          props.sub != null ? h('span', { className: 'nutri-sub' }, props.subLabel + ' ' + fmtDec(props.sub) + ' g') : null,
        );
      }

      function ProductCard(props) {
        const p = props.p;
        const per = p.unidad === 'ml' ? '100 ml' : '100 g';
        const meta = [p.marca, p.envase, fmtQty(p), Number.isInteger(p.unidades_pack) && p.unidades_pack > 1 ? p.unidades_pack + ' uds.' : null].filter(Boolean);
        const estimated = p.fuente_nutricion === 'generico_estimado';
        return h(
          'article',
          { className: 'group-card product-card' },
          h(
            'div',
            { className: 'group-heading' },
            h('span', { className: 'product-name' }, p.nombre),
            estimated ? h(Badge, { tone: 'warning' }, 'Estimado') : null,
          ),
          h(
            'div',
            { className: 'product-meta' },
            meta.map((m, i) => h(React.Fragment, { key: i }, i ? h('span', { className: 'dot' }, '·') : null, h('span', null, m))),
            meta.length ? h('span', { className: 'dot' }, '·') : null,
            h('span', { className: 'product-price' }, fmtEur(p.precio_eur)),
            p.precio_referencia_eur != null
              ? h('span', null, '(' + fmtEur(p.precio_referencia_eur) + '/' + (p.formato_referencia || '') + ')')
              : null,
          ),
          h(
            'div',
            { className: 'nutri', 'aria-label': 'Valores por ' + per },
            h(NutriCell, { label: 'kcal', value: p.kcal_100, digits: 0 }),
            h(NutriCell, { label: 'Proteínas', value: p.proteinas_100, unit: ' g' }),
            h(NutriCell, { label: 'Hidratos', value: p.carbohidratos_100, unit: ' g', sub: p.azucares_100, subLabel: 'azúcares' }),
            h(NutriCell, { label: 'Grasas', value: p.grasas_100, unit: ' g', sub: p.grasas_saturadas_100, subLabel: 'saturadas' }),
            h(NutriCell, { label: 'Fibra', value: p.fibra_100, unit: ' g' }),
            h(NutriCell, { label: 'Sal', value: p.sal_100, unit: ' g', digits: 2 }),
          ),
          h(
            'div',
            { className: 'product-foot' },
            h('span', null, 'Por ' + per + ' · ' + (estimated ? 'valores genéricos estimados, no los de la etiqueta' : 'Open Food Facts')),
            h('span', null, p.categoria + ' › ' + p.subcategoria),
            p.url ? h('a', { href: p.url, target: '_blank', rel: 'noopener' }, 'Ver en Mercadona') : null,
          ),
        );
      }

      function ProductsView(props) {
        const products = props.products;
        const [query, setQuery] = React.useState('');
        const [cat, setCat] = React.useState('');
        const [sort, setSort] = React.useState('nombre');
        const [limit, setLimit] = React.useState(PRODUCTS_PAGE);

        const cats = React.useMemo(() => [...new Set(products.map((p) => p.categoria))].sort((a, b) => a.localeCompare(b, 'es')), [products]);
        const list = React.useMemo(() => {
          const words = normalize(query.trim()).split(/\s+/).filter(Boolean);
          const s = PRODUCT_SORTS[sort];
          return products
            .filter((p) => (!cat || p.categoria === cat) && words.every((w) => p._text.includes(w)))
            .sort((a, b) => {
              const x = s.key(a),
                y = s.key(b);
              if (x == null || y == null) return x == null ? (y == null ? 0 : 1) : -1;
              return (x < y ? -1 : x > y ? 1 : 0) * s.dir;
            });
        }, [products, query, cat, sort]);
        // Back to the first page whenever the filters change
        React.useEffect(() => setLimit(PRODUCTS_PAGE), [query, cat, sort]);

        return h(
          'section',
          { className: 'view grouped-view' },
          h(
            'div',
            { className: 'search-wrap' },
            h(Icon, { name: 'search', size: 16 }),
            h('input', {
              type: 'search',
              value: query,
              placeholder: 'Buscar producto, marca o sección',
              'aria-label': 'Buscar producto, marca o sección',
              onChange: (e) => setQuery(e.target.value),
            }),
            query ? h('button', { type: 'button', className: 'search-clear', 'aria-label': 'Borrar', onClick: () => setQuery('') }, '✕') : null,
          ),
          h(
            'div',
            { className: 'product-filters' },
            h(
              'div',
              { className: 'select-shell' },
              h(
                'select',
                { className: 'pill-select', value: cat, onChange: (e) => setCat(e.target.value), 'aria-label': 'Categoría' },
                h('option', { value: '' }, 'Todas las categorías'),
                cats.map((c) => h('option', { key: c, value: c }, c)),
              ),
            ),
            h(
              'div',
              { className: 'select-shell' },
              h(
                'select',
                { className: 'pill-select', value: sort, onChange: (e) => setSort(e.target.value), 'aria-label': 'Ordenar' },
                Object.keys(PRODUCT_SORTS).map((k) => h('option', { key: k, value: k }, 'Orden: ' + PRODUCT_SORTS[k].label)),
              ),
            ),
          ),
          h('p', { className: 'search-count' }, fmtNum(list.length) + (list.length === 1 ? ' producto' : ' productos') + ' · valores por 100 g o 100 ml'),
          list.length
            ? list.slice(0, limit).map((p) => h(ProductCard, { key: p.id, p }))
            : h('p', { className: 'empty' }, 'Ningún producto coincide con la búsqueda.'),
          list.length > limit
            ? h(
                'button',
                { type: 'button', className: 'file-button more-button', onClick: () => setLimit((l) => l + PRODUCTS_PAGE * 2) },
                'Ver más (' + fmtNum(list.length - limit) + ' restantes)',
              )
            : null,
        );
      }

      // Fetches productos.json the first time the tab opens; falls back to the
      // last copy saved, or asks for the file (opened as file://)
      function ProductsTab(props) {
        const st = props.state;
        React.useEffect(() => {
          if (st.status !== 'idle') return;
          props.onState({ status: 'loading' });
          fetch(PRODUCTS_FILE, { cache: 'no-store' })
            .then((r) => {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.text();
            })
            .then((text) => {
              const products = parseProducts(text);
              try {
                localStorage.setItem(PRODUCTS_CACHE, text);
              } catch (e) {}
              props.onState({ status: 'ready', products });
            })
            .catch((err) => {
              let cached = null;
              try {
                const text = localStorage.getItem(PRODUCTS_CACHE);
                cached = text ? parseProducts(text) : null;
              } catch (e) {}
              props.onState(cached ? { status: 'ready', products: cached } : { status: 'error', error: err.message });
            });
        }, [st.status]);

        function pick(text) {
          try {
            const products = parseProducts(text);
            try {
              localStorage.setItem(PRODUCTS_CACHE, text);
            } catch (e) {}
            props.onState({ status: 'ready', products });
          } catch (err) {
            props.onState({ status: 'error', error: err.message });
          }
        }

        if (st.status === 'ready') return h(ProductsView, { products: st.products });
        if (st.status === 'error') {
          return h(
            'section',
            { className: 'view' },
            h(
              'div',
              { className: 'today-note' },
              h('p', { className: 'today-note-title' }, 'No se han podido cargar los productos'),
              h('p', null, 'No se pudo leer ' + PRODUCTS_FILE + ' (' + st.error + '). Elígelo a mano y quedará guardado para la próxima vez.'),
              h(JsonPicker, { onText: pick, label: 'Elegir ' + PRODUCTS_FILE }),
            ),
          );
        }
        return h('p', { className: 'empty' }, 'Cargando productos…');
      }

      /* ============================================================
   Header, footer and App
   ============================================================ */
      const TAB_LABELS = { hoy: 'Hoy', recetas: 'Recetas', semana: 'Semana', productos: 'Productos' };

      function Header() {
        const now = new Date();
        const date = now.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
        return h(
          'header',
          { className: 'hero' },
          h('div', null, h('h1', null, 'Plan de dieta'), h('p', { className: 'clocks' }, 'Hoy es ', h('strong', null, date))),
        );
      }

      const THEMES = { auto: 'Automático', light: 'Claro', dark: 'Oscuro' };
      function loadTheme() {
        try {
          const theme = localStorage.getItem('dieta-theme');
          return theme === 'light' || theme === 'dark' ? theme : 'auto';
        } catch (e) {
          return 'auto';
        }
      }
      function saveTheme(theme) {
        try {
          localStorage.setItem('dieta-theme', theme);
        } catch (e) {}
      }
      function ThemePicker(props) {
        return h(
          'div',
          { className: 'theme-picker', role: 'group', 'aria-label': 'Tema' },
          Object.keys(THEMES).map((t) =>
            h(
              'button',
              {
                key: t,
                type: 'button',
                className: 'tab' + (props.theme === t ? ' active' : ''),
                'aria-pressed': props.theme === t,
                onClick: () => props.onChange(t),
              },
              THEMES[t],
            ),
          ),
        );
      }

      // Pick a JSON by hand: the way in when the page cannot fetch recetas.json
      // (opened as file:// on a phone) or to try another plan
      function JsonPicker(props) {
        function onChange(e) {
          const file = e.target.files && e.target.files[0];
          e.target.value = '';
          if (!file) return;
          file.text().then(props.onText);
        }
        return h(
          'label',
          { className: 'file-button' },
          h(Icon, { name: 'upload', size: 14 }),
          props.label || 'Cargar JSON',
          h('input', { type: 'file', accept: '.json,application/json', onChange }),
        );
      }

      function DataNote(props) {
        const s = props.source;
        if (!s) return null;
        const when = s.loadedAt
          ? new Date(s.loadedAt).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
          : '';
        const text =
          s.kind === 'file'
            ? 'Recetas de ' + DATA_FILE
            : s.kind === 'picked'
              ? 'Recetas del JSON cargado a mano (' + when + ')'
              : 'Sin acceso a ' + DATA_FILE + ': usando la última copia guardada (' + when + ')';
        return h('p', { className: 'data-note' }, text + ' · ' + props.count + (props.count === 1 ? ' receta' : ' recetas'));
      }

      function PageFooter(props) {
        return h(
          'footer',
          { className: 'page-footer' },
          props.data ? h(DataNote, { source: props.source, count: props.data.recetas.length }) : null,
          props.pickError ? h('p', { className: 'data-note error' }, props.pickError) : null,
          props.data ? h(JsonPicker, { onText: props.onPick }) : null,
          h(ThemePicker, props),
        );
      }

      function loadView() {
        try {
          const v = localStorage.getItem('dieta-view');
          return TAB_LABELS[v] ? v : 'hoy';
        } catch (e) {
          return 'hoy';
        }
      }

      function App() {
        const [view, setView] = React.useState(loadView);
        const [theme, setTheme] = React.useState(loadTheme);
        // status: loading | ready | error
        const [state, setState] = React.useState({ status: 'loading' });
        const [pickError, setPickError] = React.useState(null);
        const [target, setTarget] = React.useState({ id: null, tick: 0 });
        // Productos loads on its own, the first time its tab opens: idle | loading | ready | error
        const [productsState, setProductsState] = React.useState({ status: 'idle' });

        React.useEffect(() => {
          try {
            localStorage.setItem('dieta-view', view);
          } catch (e) {}
        }, [view]);
        React.useEffect(() => {
          saveTheme(theme);
          if (theme === 'auto') delete document.documentElement.dataset.theme;
          else document.documentElement.dataset.theme = theme;
        }, [theme]);

        // recetas.json first; if it cannot be fetched (file://, offline) or is
        // broken, the last copy that loaded
        React.useEffect(() => {
          fetch(DATA_FILE, { cache: 'no-store' })
            .then((r) => {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.text();
            })
            .then((text) => {
              const data = parseData(text);
              saveCached(text);
              setState({ status: 'ready', data, source: { kind: 'file' } });
            })
            .catch((err) => {
              const cached = loadCached();
              if (cached) setState({ status: 'ready', data: cached.data, source: { kind: 'cache', loadedAt: cached.loadedAt } });
              else setState({ status: 'error', error: err instanceof SyntaxError ? 'El JSON no es válido: ' + err.message : err.message });
            });
        }, []);

        function pick(text) {
          try {
            const data = parseData(text);
            saveCached(text);
            setPickError(null);
            setState({ status: 'ready', data, source: { kind: 'picked', loadedAt: new Date().toISOString() } });
          } catch (err) {
            setPickError('No se pudo cargar el JSON: ' + err.message);
          }
        }

        // Same fade as the itinerary: shown only while the tabs are pinned
        React.useEffect(() => {
          let frame = 0;
          function update() {
            frame = 0;
            document.querySelectorAll('.sticky-bar').forEach((bar) => {
              const top = parseFloat(getComputedStyle(bar).top) || 0;
              bar.toggleAttribute('data-stuck', bar.getBoundingClientRect().top <= top + 0.5);
            });
          }
          function schedule() {
            if (!frame) frame = requestAnimationFrame(update);
          }
          update();
          window.addEventListener('scroll', schedule, { passive: true });
          window.addEventListener('resize', schedule);
          return () => {
            cancelAnimationFrame(frame);
            window.removeEventListener('scroll', schedule);
            window.removeEventListener('resize', schedule);
          };
        }, [view]);

        function openRecipe(id) {
          setTarget((t) => ({ id, tick: t.tick + 1 }));
          setView('recetas');
        }
        function selectView(v) {
          if (v !== 'recetas') setTarget((t) => ({ id: null, tick: t.tick }));
          setView(v);
        }

        let content;
        if (view === 'productos') {
          content = h(ProductsTab, { state: productsState, onState: setProductsState });
        } else if (state.status === 'loading') {
          content = h('p', { className: 'empty' }, 'Cargando recetas…');
        } else if (state.status === 'error') {
          content = h(
            'section',
            { className: 'view' },
            h(
              'div',
              { className: 'today-note' },
              h('p', { className: 'today-note-title' }, 'No se han podido cargar las recetas'),
              h(
                'p',
                null,
                'No se pudo leer ' + DATA_FILE + ' (' + state.error + '). Abierto como archivo, el navegador no deja leerlo: elígelo a mano y quedará guardado para la próxima vez.',
              ),
              h(JsonPicker, { onText: pick, label: 'Elegir ' + DATA_FILE }),
              pickError ? h('p', { className: 'data-note error' }, pickError) : null,
            ),
          );
        } else if (view === 'hoy') {
          content = h(TodayView, { data: state.data, onOpenRecipe: openRecipe });
        } else if (view === 'semana') {
          content = h(WeekView, { data: state.data, onOpenRecipe: openRecipe });
        } else {
          content = h(RecipesView, { data: state.data, target: target.id, targetTick: target.tick });
        }

        return h(
          'div',
          { className: 'page' },
          h(Header, null),
          h(
            'nav',
            { className: 'tabs sticky-bar' },
            h(
              'div',
              { className: 'segment' },
              h(
                'div',
                { className: 'segment-tabs' },
                Object.keys(TAB_LABELS).map((v) =>
                  h(
                    'button',
                    {
                      key: v,
                      type: 'button',
                      className: 'tab' + (view === v ? ' active' : ''),
                      onClick: () => selectView(v),
                      'aria-pressed': view === v,
                      'aria-label': TAB_LABELS[v],
                      title: TAB_LABELS[v],
                    },
                    h(Icon, { name: v }),
                    h('span', { className: 'tab-label' }, TAB_LABELS[v]),
                  ),
                ),
              ),
            ),
          ),
          content,
          h(PageFooter, {
            theme,
            onChange: setTheme,
            data: state.data,
            source: state.source,
            onPick: pick,
            pickError: state.status === 'ready' ? pickError : null,
          }),
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(h(App));
    </script>
  </body>
</html>
